[project]
name = "rag-chatbot-starter"
version = "0.5.0"
description = "Clone-and-own boilerplate for a config-driven RAG chatbot backend (FastAPI, Postgres, pgvector)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "openai>=1.50",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2",
]
# Local cross-encoder reranker (retrieval.rerank with a cross_encoder profile). Pulls in torch.
rerank = [
    "sentence-transformers>=3.0",
]
# Qdrant as the vector store (vector_store.backend: qdrant). Ollama needs no extra: httpx.
qdrant = [
    "qdrant-client>=1.15",
]
# OpenTelemetry traces and metrics over OTLP/HTTP (observability.otel, ADR 026).
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]
# Langfuse as a tracing backend (observability.langfuse, ADR 027). Same packages as otel:
# spans go to Langfuse's OTLP endpoint, so the Langfuse SDK is not needed.
langfuse = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]
# LangGraph as the orchestrator (orchestrator: langgraph, ADR 029). Plain Python is the default.
langgraph = [
    "langgraph>=1.2",
]
# GraphQL is still open (docs/roadmap.md).

[project.scripts]
chatbot = "chatbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # Qdrant's in-process local mode (used by the tests) ignores payload indexes and HNSW.
    "ignore:Payload indexes have no effect:UserWarning",
    "ignore:Local mode performs exact:UserWarning",
]
markers = [
    "integration: needs Postgres with pgvector (set TEST_DATABASE_URL)",
    "e2e: full ingest-to-answer path against Postgres",
    "live: calls the real OpenAI API (set OPENAI_API_KEY and RUN_LIVE_TESTS=1)",
    "qdrant: Qdrant store (in-process local mode, or a server when QDRANT_TEST_URL is set)",
    "ollama: a real Ollama server (set OLLAMA_TEST_URL; models must be pulled)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"samples/**" = ["E501"]
