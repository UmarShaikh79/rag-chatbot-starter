apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-api
  labels:
    app.kubernetes.io/name: chatbot-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatbot-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: chatbot
      # Streams (SSE) can run for a while: give them time to finish on rollout.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001      # the `app` user in docker/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migrations before the API starts. Safe with many replicas: `chatbot migrate`
        # takes a Postgres advisory lock, so one pod migrates and the others wait.
        - name: migrate
          image: chatbot
          command: ["chatbot", "migrate"]
          envFrom: &env
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secrets
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &tmp
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
      containers:
        - name: api
          image: chatbot
          command: ["chatbot", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom: *env
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          # /livez never touches the database, so a database outage does not restart every
          # pod; /readyz does, so traffic stops going to pods that cannot serve it.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Let the Service drop this pod before it stops accepting connections.
              sleep: {seconds: 5}
          securityContext: *container-security
          volumeMounts: *tmp
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-api
  labels:
    app.kubernetes.io/name: chatbot-api
spec:
  selector:
    app.kubernetes.io/name: chatbot-api
  ports:
    - name: http
      port: 80
      targetPort: http
