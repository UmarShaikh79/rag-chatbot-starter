# Background jobs: ingestion, memory refresh (summaries, facts). Scale replicas (or
# CHATBOT__INGESTION__WORKER__CONCURRENCY) with the queue; jobs are claimed with
# SKIP LOCKED, so any number of workers can run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-worker
  labels:
    app.kubernetes.io/name: chatbot-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatbot-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: chatbot
      # On SIGTERM the worker stops claiming and finishes the job it holds. A job cut off
      # here is retried later (ingestion.worker.lock_timeout_s).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: chatbot
          command: ["chatbot", "worker"]
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
