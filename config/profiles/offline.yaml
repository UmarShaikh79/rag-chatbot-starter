# Runs the whole pipeline with no API key: a hashing embedder and an extractive fake LLM.
# Good for trying the template and for CI. Answers are quotes, not generated prose.
models:
  answer: fake:extractive
  cheap: fake:extractive
  embed: hashing:384
vector_store:
  index: docs_offline
retrieval:
  # Hashing-embedder cosine scores sit on a different scale from OpenAI's (ADR 011). These are
  # provisional; `chatbot calibrate` replaces them per index and pipeline. Lexical scores
  # cannot separate unanswerable questions that share words with the corpus; with a real
  # model the answer prompt's INSUFFICIENT_CONTEXT path catches those.
  min_score: 0.08
  min_hits: 1
guardrails:
  groundedness:
    judge: lexical                  # the fake LLM is not a judge
evals:
  faithfulness_judge: lexical
observability:
  log_format: text
