# Main configuration. Profiles in config/profiles/ override this file, and
# environment variables override both: CHATBOT__RETRIEVAL__TOP_K=5.
# Secrets never live here; only the *names* of env vars that hold them.
# Unknown keys fail startup with the exact path (see src/chatbot/core/settings.py).

app:
  name: rag-chatbot
  env: dev                          # dev | prod

api:
  docs: true                        # serve /docs, /redoc and /openapi.json
  cors:                             # browsers calling the API from another domain
    allow_origins: []               # e.g. [https://app.example.com]; [] = off; ["*"] = any
    allow_credentials: false        # cookies; not needed for Authorization headers

auth:
  mode: api_key                     # none | api_key | jwt | api_key_or_jwt (ADR 017)
  api_keys_env: CHATBOT_API_KEYS    # comma-separated SHA-256 hashes; `chatbot hash-key` makes one
  jwt:                              # used by the jwt modes; tokens from any OIDC provider
    issuer: null                    # e.g. https://your-tenant.eu.auth0.com/ (must match iss)
    audience: null                  # e.g. chatbot-api (must appear in aud)
    jwks_url: null                  # null: discovered from {issuer}/.well-known/openid-configuration
    algorithms: [RS256, ES256]      # add HS256 only for local dev tokens
    hs256_secret_env: null          # env var with the HS256 secret (`chatbot dev-token`)
    user_id_claim: sub              # becomes the chat user_id; end users can't pick another
    required_scopes: []
    admin_scope: "chatbot:admin"    # may act for any user and use ingestion routes
    leeway_s: 30
    jwks_cache_s: 3600

models:                             # names point into config/models.yaml
  answer: openai:answer
  cheap: openai:cheap
  embed: openai:text-embedding-3-small

database:
  url_env: DATABASE_URL             # postgresql://user:pass@host:5432/db
  pool_min: 1
  pool_max: 10

vector_store:
  backend: pgvector                 # pgvector | qdrant (ADR 024; `uv sync --extra qdrant`)
  index: docs                       # alias; the physical index records embed model + dims (ADR 005)
                                    # changing the embedder, chunker or backend: `chatbot reindex` (ADR 023)
  distance: cosine
  hnsw:                             # ADR 012; needs pgvector >= 0.8
    m: 16
    ef_construction: 64
    ef_search: 100
    iterative_scan: relaxed_order   # off | strict_order | relaxed_order
    max_scan_tuples: 20000
  exact_scan_threshold: 2000        # filters matching <= this many chunks skip HNSW and scan exactly
  text_search_config: english       # Postgres text search config for BM25; fixed per index (ADR 020)
  qdrant:                           # used when backend: qdrant; Postgres still keeps the catalog
    url_env: QDRANT_URL             # http://localhost:6333 when unset (see url)
    url: http://localhost:6333
    api_key_env: QDRANT_API_KEY     # Qdrant Cloud; ignored when the variable is unset
    location: null                  # ":memory:" = in-process local mode, for tests only
    prefer_grpc: false
    timeout_s: 30
    hnsw: {m: 16, ef_construct: 100}
    hnsw_ef: 128                    # search beam width (like pgvector's ef_search)
    on_disk: false                  # memmap vectors instead of holding them in RAM
    upsert_batch: 256

ingestion:
  sources:
    - name: samples
      type: files
      path: samples/docs
      include: ["*.pdf", "*.md", "*.docx", "*.html", "*.txt"]
    # Rows from your app's database, one document per row (any SQLAlchemy database):
    # - name: articles
    #   type: sql
    #   options:
    #     url_env: APP_DATABASE_URL
    #     query: SELECT id, title, body, category FROM help_articles WHERE published
    #     id_column: id
    #     title_column: title
    #     text_columns: [title, body]
    #     metadata_columns: [category]
  chunker:
    type: recursive
    size_tokens: 512
    overlap_tokens: 64
    tokenizer: approx               # approx (chars/4, no downloads) | tiktoken (needs the tiktoken package)
  embed_batch_size: 64
  worker:
    concurrency: 2
    max_attempts: 3
    poll_interval_s: 1.0
    lock_timeout_s: 600             # a job locked longer than this is considered abandoned

retrieval:
  strategy: dense                   # dense | bm25 | hybrid (ADR 019)
  top_k: 8
  bm25:                             # Okapi BM25 in Postgres, no extension (ADR 020)
    k1: 1.2
    b: 0.75
  hybrid:                           # used when strategy: hybrid
    retrievers: [dense, bm25]
    candidates: 20                  # hits per retriever before fusion
    rrf_k: 60                       # reciprocal rank fusion constant
    weights: {}                     # e.g. {dense: 1.0, bm25: 0.5}
  hyde:                             # embed a hypothetical answer (one cheap-model call)
    enabled: false
    prompt: hyde/v1
    model_role: cheap
    apply_to: [dense]
    include_query: true
  query_rewrite:                    # make follow-ups standalone before retrieval
    enabled: false
    prompt: rewrite_query/v1
    model_role: cheap
    only_with_history: true
  rerank:
    enabled: false
    model: cohere:rerank       # a name under rerankers in config/models.yaml
    candidates: 20                  # retrieved hits handed to the reranker; top_k are kept
    fallback: true                  # reranker down or rate-limited: answer from retrieval order
  gate: auto                        # score min_score applies to: auto | dense | bm25 | rerank
  min_score: 0.35                   # provisional until `chatbot calibrate` (ADR 011, ADR 021)
  min_hits: 1                       # always paired with min_score
  min_hits_filtered: 1              # min_hits for requests with filters (a slice of the corpus); null: same
  thresholds_from: index            # index | config; calibrated values stored with the index win

answer:
  prompt: answer/v2                 # v2 adds the memory section; v1 still works
  clarify_prompt: clarify/v1
  max_context_chunks: 6
  citations: required               # required | optional
  on_weak_retrieval: clarify        # clarify | refuse
  stream_mode: draft_then_final     # draft_then_final | buffered (ADR 014)

memory:
  backend: postgres
  history_turns: 10
  redact_before_persist: true       # ADR 015
  run_in: worker                    # worker (background job after each turn) | inline (ADR 016)
  summary:                          # rolling summary of turns older than the history window
    enabled: true
    prompt: summarize/v1
    refresh_after_turns: 4          # fold once this many turns have left the window
    max_chars: 1500
  long_term:                        # facts about a user_id, kept across conversations
    enabled: true
    prompt: extract_facts/v1
    max_facts_per_user: 50          # oldest (least recently seen) are dropped beyond this
    facts_in_prompt: 20
    max_fact_chars: 200

guardrails:
  input:
    max_chars: 4000
    pii_redaction: true
    injection_check: true
  context:
    injection_check: true           # drop retrieved chunks that look like instructions
  output:                           # runs on the complete answer, in streaming mode too
    pii_redaction: true
    prompt_leak_check: true         # refuse answers that repeat the system prompt verbatim
    groundedness_check: false       # judge every answer against its sources (one more call)
  pii:
    detectors: [regex]              # regex | presidio (names, places; `uv sync --extra presidio`)
    output_detectors: [regex]       # for answers (from your documents); null: same as detectors
    # Strings never redacted (whole detected span, any case). NER models such as presidio tag
    # product and integration names in questions as people, so a question about them loses
    # that word before retrieval. These are the sample product's names: replace them with your
    # product, feature, integration and staff names, and your public support address.
    allow: [Tidepool, Tidepool Notes]
    presidio:
      language: en
      spacy_model: en_core_web_sm
      score_threshold: 0.5
  injection:
    detectors: [heuristic]          # heuristic | llm (a classifier call on the cheap model)
    llm:
      model_role: cheap
      prompt: guard_injection/v1
      stages: [input]               # input | context; one model call per checked text
      on_error: allow               # allow | block when the classifier call fails
  groundedness:                     # the output check above and the eval faithfulness metric
    judge: llm                      # llm | lexical (word overlap, offline)
    model_role: cheap
    prompt: judge_groundedness/v1
    min_score: 0.7                  # share of the answer's claims the sources support
    on_fail: clarify                # clarify | refuse | warn
    on_error: allow                 # allow | block when the judge call fails
  stream_holdback_chars: 64         # rolling buffer so PII is never split across SSE events

evals:                              # `chatbot eval` and `chatbot calibrate` (ADR 010, ADR 021)
  dataset: evals/datasets/golden.jsonl
  gate: evals/gate.yaml             # floors and allowed regression, checked with --gate
  baselines_dir: evals/baselines
  hit_at: [1, 3]                    # hit@k reported besides hit@top_k
  faithfulness_judge: llm           # llm | lexical | off
  concurrency: 4
  calibration:
    target_answer_recall: 0.9       # keep at least this share of answerable questions
    max_min_hits: 3                 # min_hits values tried: 1..3
    min_unanswerable: 5             # warn when the dataset has fewer unanswerable questions

observability:                      # docs/observability.md
  log_level: INFO
  log_format: json                  # json | text
  log_message_text: false           # never log user or model text unless you turn this on
  otel:                             # OpenTelemetry traces + metrics over OTLP/HTTP (ADR 026)
    enabled: false                  # needs `uv sync --extra otel`
    service_name: null              # default app.name; OTEL_SERVICE_NAME wins
    traces: true                    # where to: OTEL_EXPORTER_OTLP_ENDPOINT / _HEADERS
    metrics: true
    metrics_interval_s: 30
    sample_ratio: 1.0               # share of traces kept (a parent's decision wins)
    capture_text: false             # prompts, answers, chunks on spans (redacted text)
    console: false                  # also print spans to stdout
  langfuse:                         # Langfuse via its OTLP endpoint, no SDK (ADR 027)
    enabled: false                  # needs `uv sync --extra langfuse`
    base_url_env: LANGFUSE_BASE_URL # unset -> base_url
    base_url: https://cloud.langfuse.com
    public_key_env: LANGFUSE_PUBLIC_KEY
    secret_key_env: LANGFUSE_SECRET_KEY
    capture_text: true              # redacted text leaves your infrastructure: see ADR 027
    send_user_id: true
  usage:                            # token and cost accounting (ADR 028)
    persist: true                   # a usage_records row per turn, job or CLI run; `chatbot usage`

orchestrator: simple                # simple | langgraph (`uv sync --extra langgraph`, ADR 029)
