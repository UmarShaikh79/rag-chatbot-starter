# Main configuration. Profiles in config/profiles/ override this file, and
# environment variables override both: CHATBOT__RETRIEVAL__TOP_K=5.
# Secrets never live here; only the *names* of env vars that hold them.
# Unknown keys fail startup with the exact path (see src/chatbot/core/settings.py).

app:
  name: rag-chatbot
  env: dev                          # dev | prod

auth:
  mode: api_key                     # none | api_key | jwt | api_key_or_jwt (ADR 017)
  api_keys_env: CHATBOT_API_KEYS    # comma-separated SHA-256 hashes; `chatbot hash-key` makes one
  jwt:                              # used by the jwt modes; tokens from any OIDC provider
    issuer: null                    # e.g. https://your-tenant.eu.auth0.com/ (must match iss)
    audience: null                  # e.g. chatbot-api (must appear in aud)
    jwks_url: null                  # null: discovered from {issuer}/.well-known/openid-configuration
    algorithms: [RS256, ES256]      # add HS256 only for local dev tokens
    hs256_secret_env: null          # env var with the HS256 secret (`chatbot dev-token`)
    user_id_claim: sub              # becomes the chat user_id; end users can't pick another
    required_scopes: []
    admin_scope: "chatbot:admin"    # may act for any user and use ingestion routes
    leeway_s: 30
    jwks_cache_s: 3600

models:                             # names point into config/models.yaml
  answer: openai:answer
  cheap: openai:cheap
  embed: openai:text-embedding-3-small

database:
  url_env: DATABASE_URL             # postgresql://user:pass@host:5432/db
  pool_min: 1
  pool_max: 10

vector_store:
  backend: pgvector
  index: docs                       # alias; the physical index records embed model + dims (ADR 005)
  distance: cosine
  hnsw:                             # ADR 012; needs pgvector >= 0.8
    m: 16
    ef_construction: 64
    ef_search: 100
    iterative_scan: relaxed_order   # off | strict_order | relaxed_order
    max_scan_tuples: 20000
  exact_scan_threshold: 2000        # filters matching <= this many chunks skip HNSW and scan exactly

ingestion:
  sources:
    - name: samples
      type: files
      path: samples/docs
      include: ["*.pdf", "*.md", "*.docx", "*.html", "*.txt"]
  chunker:
    type: recursive
    size_tokens: 512
    overlap_tokens: 64
    tokenizer: approx               # approx (chars/4, no downloads) | tiktoken (needs the tiktoken package)
  embed_batch_size: 64
  worker:
    concurrency: 2
    max_attempts: 3
    poll_interval_s: 1.0
    lock_timeout_s: 600             # a job locked longer than this is considered abandoned

retrieval:
  strategy: dense                   # dense (M1); bm25 | hybrid come in M3
  top_k: 8
  min_score: 0.35                   # provisional; calibrated per embedding model in M3 (ADR 011)
  min_hits: 1                       # always paired with min_score
  thresholds_from: index            # index | config; calibrated values stored with the index win

answer:
  prompt: answer/v2                 # v2 adds the memory section; v1 still works
  clarify_prompt: clarify/v1
  max_context_chunks: 6
  citations: required               # required | optional
  on_weak_retrieval: clarify        # clarify | refuse
  stream_mode: draft_then_final     # draft_then_final | buffered (ADR 014)

memory:
  backend: postgres
  history_turns: 10
  redact_before_persist: true       # ADR 015
  run_in: worker                    # worker (background job after each turn) | inline (ADR 016)
  summary:                          # rolling summary of turns older than the history window
    enabled: true
    prompt: summarize/v1
    refresh_after_turns: 4          # fold once this many turns have left the window
    max_chars: 1500
  long_term:                        # facts about a user_id, kept across conversations
    enabled: true
    prompt: extract_facts/v1
    max_facts_per_user: 50          # oldest (least recently seen) are dropped beyond this
    facts_in_prompt: 20
    max_fact_chars: 200

guardrails:
  input:
    max_chars: 4000
    pii_redaction: true
    injection_check: true
  context:
    injection_check: true           # drop retrieved chunks that look like instructions
  output:                           # runs on the complete answer, in streaming mode too
    pii_redaction: true
    prompt_leak_check: true         # refuse answers that repeat the system prompt verbatim
  pii:
    detectors: [regex]              # regex | presidio (names, places; `uv sync --extra presidio`)
    allow: []                       # strings never redacted, e.g. your public support email
    presidio:
      language: en
      spacy_model: en_core_web_sm
      score_threshold: 0.5
  injection:
    detectors: [heuristic]          # heuristic | llm (a classifier call on the cheap model)
    llm:
      model_role: cheap
      prompt: guard_injection/v1
      stages: [input]               # input | context; one model call per checked text
      on_error: allow               # allow | block when the classifier call fails
  stream_holdback_chars: 64         # rolling buffer so PII is never split across SSE events

observability:
  log_level: INFO
  log_format: json                  # json | text
  log_message_text: false           # never log user or model text unless you turn this on

orchestrator: simple
