name: Bug report
description: Something doesn't work as the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste API keys, tokens or `.env` contents.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. CHATBOT_PROFILE=offline make up
        2. make ingest
        3. make ask Q="..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: The `trace_id` from the response helps find the matching log line.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.6.0, or the commit you copied from
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [offline, dev (OpenAI), local-ollama, prod, other]
  - type: input
    id: env
    attributes:
      label: How you run it
      placeholder: Docker Compose on macOS / uv on Linux / Kubernetes ...
