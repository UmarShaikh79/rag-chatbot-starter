# Weekly update PRs for dependencies. Each runs the full CI, including the eval gate.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker        # base image in docker/Dockerfile
    directory: /docker
    schedule:
      interval: weekly
    # A new Python version (3.12 -> 3.15) is a deliberate change: optional extras need wheels
    # for it (presidio, qdrant and langgraph failed to build on 3.15 in 2026-11), and CI's
    # python-version must move with it. Bump both together by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
