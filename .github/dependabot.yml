# Weekly update PRs for dependencies. Each runs the full CI, including the eval gate.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker        # base image in docker/Dockerfile
    directory: /docker
    schedule:
      interval: weekly
