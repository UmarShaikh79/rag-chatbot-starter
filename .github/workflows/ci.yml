name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports: ["6333:6333"]
    env:
      TEST_DATABASE_URL: postgresql://chatbot:chatbot@localhost:5432/chatbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra qdrant --extra otel --extra langgraph
      # Unit, integration and end-to-end (offline profile); the Qdrant tests use the
      # in-process local mode here, the OpenTelemetry tests in-memory exporters. Live OpenAI
      # and Ollama tests stay opt-in.
      - run: uv run pytest -ra
      # The Qdrant store again, against a real server (payload indexes, HNSW, gRPC-free REST).
      - run: uv run pytest -ra -m qdrant
        env:
          QDRANT_TEST_URL: http://localhost:6333

  # The base install (no extras) must import and pass on its own: every optional module
  # (OpenTelemetry, Langfuse, LangGraph, Qdrant) stays optional.
  test-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -ra tests/unit

  # The Kubernetes example (ADR 030) renders and validates against the API schemas.
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Render and validate each overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -kubernetes-version 1.33.0 -
            echo "::endgroup::"
          done

  # The regression gate (ADR 010, ADR 022): ingest the sample corpus with the offline profile,
  # calibrate thresholds on the golden set, then fail the build below evals/gate.yaml floors
  # or on a drop from evals/baselines/offline.json.
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://chatbot:chatbot@localhost:5432/chatbot
      CHATBOT_PROFILE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run chatbot migrate
      - run: uv run chatbot ingest --inline
      - run: uv run chatbot calibrate --apply --check
      - run: uv run chatbot eval --gate --out eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore
