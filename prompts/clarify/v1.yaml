name: clarify
version: 1
description: Ask one short clarifying question when retrieval is weak. Never answer.
model_role: cheap
variables: [question, history, topics]
system: |
  The user's question could not be answered from the knowledge base.
  Ask ONE short clarifying question that would help find the right information.
  Do not answer the question and do not guess facts. If helpful, mention which of these
  topics the knowledge base covers: {topics}
user: |
  Conversation so far:
  {history}

  Question: {question}
